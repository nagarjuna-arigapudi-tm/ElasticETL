pipelines:
  - name: "basic-auth-pipeline"
    enabled: true
    schedule:
      interval: "5m"
    extract:
      urls:
        - "http://localhost:9200/_search"
      cluster_names:
        - "local-cluster"
      # Basic authentication configuration
      auth_basic:
        user: "elastic"
        password: "mypassword"
        password_type: "PLAIN_TEXT"  # Default if not specified
      elasticsearch_query: |
        {
          "query": {
            "match_all": {}
          },
          "size": 100
        }
      timeout: "30s"
      max_retries: 3
    transform:
      stateless: false
      conversion_functions: []
    load:
      input: "transformed_data"
      streams:
        - type: "debug"
          config:
            output_path: "/tmp/debug-output.json"

  - name: "encrypted-auth-pipeline"
    enabled: true
    schedule:
      interval: "10m"
    extract:
      urls:
        - "https://api.example.com/data"
      cluster_names:
        - "production"
      # Encrypted password example
      auth_basic:
        user: "apiuser"
        password: "U2FsdGVkX1+vupppZksvRf5pq5g5XjFRIipRkwB0K1Y="  # Encrypted password
        password_type: "ENCRYPTED_BASE64"
        passkey: "my-secret-encryption-key-32-chars"
      elasticsearch_query: |
        {
          "query": {
            "range": {
              "@timestamp": {
                "gte": "now-1h"
              }
            }
          }
        }
      timeout: "60s"
      max_retries: 5
    transform:
      stateless: true
      conversion_functions: []
    load:
      input: "transformed_data"
      streams:
        - type: "csv"
          config:
            file_path: "/tmp/encrypted-auth-output.csv"

  - name: "env-var-auth-pipeline"
    enabled: true
    schedule:
      interval: "15m"
    extract:
      urls:
        - "https://secure-api.example.com/metrics"
      cluster_names:
        - "secure-cluster"
      # Environment variable password example
      auth_basic:
        user: "monitoring"
        password: "API_PASSWORD_VAR"  # Environment variable name
        password_type: "ENV_VAR"
      elasticsearch_query: |
        {
          "query": {
            "bool": {
              "must": [
                {
                  "term": {
                    "service": "web"
                  }
                }
              ]
            }
          }
        }
      timeout: "45s"
      max_retries: 3
    transform:
      stateless: false
      conversion_functions:
        - field: "response_time"
          function: "convert_type"
          from_type: "string"
          to_type: "float"
    load:
      input: "transformed_data"
      streams:
        - type: "prometheus"
          config:
            remote_write_url: "http://prometheus:9090/api/v1/write"

global:
  resource_limits:
    max_memory_mb: 512
    max_cpu_percent: 80
    max_goroutines: 100
    max_connections: 50
  metrics:
    enabled: true
    port: 8080
    path: "/metrics"
    interval: "30s"
  logging:
    level: "info"
    format: "json"
    output: "stdout"
