pipelines:
  - name: "sample-pipeline-with-drop-null"
    enabled: true
    interval: 30s
    retryInterval: 5h
    extract:
      elasticsearch_query: |
        {
          "query": {
            "match_all": {}
          }
        }
      urls:
        - "https://elasticsearch.example.com:9200/sample-index/_search"
      cluster_names:
        - "sample-cluster"
      auth_headers:
        - "Authorization: Bearer your-token-here"
      json_path: "hits.hits._source"
      interval: 30s
      timeout: 10s
      max_retries: 3
    transform:
      stateless: true
      drop_null_values: true
      previous_results_sets: 0
      output_format: "csv"
      conversion_functions:
        - field: "memory_usage"
          function: "convert_to_mb"
          # from_unit defaults to "bytes" if not specified
        - field: "disk_size"
          function: "convert_to_gb"
          from_unit: "kb"
        - field: "network_bytes"
          function: "convert_to_kb"
          from_unit: "bytes"
    load:
      input: "csv_data"
      streams:
        - type: "debug"
          config:
            output_file: "/tmp/sample-output.csv"

global:
  resource_limits:
    max_memory_mb: 512
    max_cpu_percent: 80
    max_goroutines: 100
    max_connections: 50
  metrics:
    enabled: true
    port: 8080
    path: "/metrics"
    interval: 30s
  logging:
    level: "info"
    format: "json"
    output: "stdout"
